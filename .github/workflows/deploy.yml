name: CRDent CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  POSTGRES_VERSION: '15'

jobs:
  # ========================================
  # FRONTEND CI
  # ========================================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ========================================
  # BACKEND CI
  # ========================================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: crdent
          POSTGRES_PASSWORD: crdent_dev_password
          POSTGRES_DB: crdent
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U crdent -d crdent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://crdent:crdent_dev_password@localhost:5432/crdent?schema=public

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests (if any)
        run: |
          if [ -f "jest.config.js" ] || [ -f "vitest.config.ts" ] || [ -f "package.json" ] && grep -q '"test"' package.json; then
            npm test
          else
            echo "No test script found, skipping..."
          fi

  # ========================================
  # DOCKER BUILD TEST
  # ========================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: crdent-frontend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: crdent-backend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test frontend container
        run: |
          docker run -d --name frontend-test -p 3000:80 crdent-frontend:test
          sleep 3
          echo "=== Container status ==="
          docker ps -a --filter name=frontend-test
          echo "=== Container logs ==="
          docker logs frontend-test
          echo "=== Testing connection ==="
          curl -f http://localhost:3000/ || (echo "curl failed" && docker logs frontend-test && docker stop frontend-test && docker rm frontend-test && exit 1)
          docker stop frontend-test
          docker rm frontend-test

      - name: Test backend container
        run: |
          docker network create test-network || true
          docker run --rm -d --name db-test --network test-network -e POSTGRES_USER=crdent -e POSTGRES_PASSWORD=crdent_dev_password -e POSTGRES_DB=crdent postgres:15-alpine
          sleep 10
          docker run --rm -d --name backend-test --network test-network -p 3001:3001 \
            -e DATABASE_URL=postgresql://crdent:crdent_dev_password@db-test:5432/crdent?schema=public \
            -e JWT_SECRET=test-secret \
            -e NODE_ENV=production \
            crdent-backend:test
          sleep 15
          curl -f http://localhost:3001/health || (docker logs backend-test && exit 1)
          docker stop backend-test db-test
          docker network rm test-network || true

  # ========================================
  # DEPLOY TO PORTAINER
  # ========================================
  deploy:
    name: Deploy to Portainer
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Portainer redeploy
        run: |
          echo "Triggering Portainer stack redeploy..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
            "https://cont.asb.web.tr/api/stacks/102/git/redeploy?endpointId=2" \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"Env":[],"Prune":false,"RepullImageAndRedeploy":true}')
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Portainer redeploy triggered successfully"
          else
            echo "❌ Portainer redeploy failed"
            exit 1
          fi

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 60
          
          # Check if services are healthy
          for i in {1..10}; do
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" https://crmdemo.asb.web.tr/api/health || echo "000")
            if [ "$HEALTH" = "200" ]; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Attempt $i: Health check returned $HEALTH, waiting..."
            sleep 30
          done
          echo "❌ Health check failed after 10 attempts"
          exit 1

      - name: Notify success
        if: success()
        run: |
          echo "🎉 Deployment successful!"
          echo "Commit: ${{ github.sha }}"
          echo "URL: https://crmdemo.asb.web.tr"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Commit: ${{ github.sha }}"
          echo "Check GitHub Actions logs for details"