name: CRDent Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Portainer stack webhook tetikle
        run: |
          echo "CRDent güncellemesi gönderiliyor: ${{ github.sha }}"
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main","sha":"${{ github.sha }}","repository":"asbajans/CR"}'
          echo "Portainer tetiklendi."
